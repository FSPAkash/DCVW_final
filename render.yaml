services:
  - type: web
    name: dcw-siop
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /tmp/dcw-siop
      - key: MASTER_EDIT_MODE
        value: download-upload
      - key: MASTER_OVERVIEW_OPENAI_MODEL
        value: gpt-4o-mini
      - key: MASTER_OVERVIEW_OPENAI_API_KEY
        sync: false
